<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicoPet Web Controller</title>
  <style>
    body {
      background: #14171a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e2328;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      margin-bottom: 24px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      font-size: 14px;
      color: #888;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e53935;
      margin-right: 8px;
    }
    .dot.connected { background: #4caf50; }
    .stats-row {
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-top: 12px;
    }
    .stat-val { font-size: 22px; font-weight: bold; }
    .stat-lbl { font-size: 12px; color: #aaa; margin-top: 4px; }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }
    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-connect { grid-column: span 2; background: #2196f3; margin-bottom: 8px; }
    .btn-feed { background: #fb8c00; }
    .btn-play { background: #8e24aa; }
    .btn-clean { background: #0288d1; }
    .btn-sleep { background: #3949ab; }
    .btn-meds { grid-column: span 2; background: #00897b; }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-bar">
      <div id="dot" class="dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
    <div class="stats-row">
      <div>
        <div id="stat-steps" class="stat-val" style="color: #ffd54f;">0</div>
        <div class="stat-lbl">Steps</div>
      </div>
      <div>
        <div id="stat-health" class="stat-val" style="color: #e57373;">10/10</div>
        <div class="stat-lbl">Health</div>
      </div>
      <div>
        <div id="stat-happy" class="stat-val" style="color: #81c784;">10/10</div>
        <div class="stat-lbl">Happiness</div>
      </div>
    </div>
  </div>

  <div class="btn-grid">
    <button id="connect-btn" class="btn-connect" onclick="connectBLE()">Connect to PicoPet</button>
    <button class="btn-feed" onclick="sendAction('FEED')" disabled>Feed Snack</button>
    <button class="btn-play" onclick="sendAction('PLAY')" disabled>Play Game</button>
    <button class="btn-clean" onclick="sendAction('CLEAN')" disabled>Clean Up</button>
    <button class="btn-sleep" onclick="sendAction('SLEEP')" disabled>Lights / Sleep</button>
    <button class="btn-meds" onclick="sendAction('MEDS')" disabled>Give Vitamins</button>
  </div>

  <script>
    const SERVICE_UUID    = "0000fff0-0000-1000-8000-00805f9b34fb";
    const CHAR_ACTION_UUID = "0000fff1-0000-1000-8000-00805f9b34fb";
    const CHAR_STATUS_UUID = "0000fff2-0000-1000-8000-00805f9b34fb";

    let actionChar = null;

    async function connectBLE() {
      try {
        updateStatus("Requesting Bluetooth device...", false);
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "PicoPet" }],
          optionalServices: [SERVICE_UUID]
        });

        device.addEventListener('gattserverdisconnected', onDisconnected);

        updateStatus("Connecting to GATT Server...", false);
        const server = await device.gatt.connect();

        updateStatus("Discovering services...", false);
        const service = await server.getPrimaryService(SERVICE_UUID);

        actionChar = await service.getCharacteristic(CHAR_ACTION_UUID);
        const statusChar = await service.getCharacteristic(CHAR_STATUS_UUID);

        // Listen for live status notifications
        await statusChar.startNotifications();
        statusChar.addEventListener('characteristicvaluechanged', handleStatusUpdate);

        updateStatus("Connected to PicoPet", true);
        enableButtons(true);
      } catch (err) {
        console.error(err);
        updateStatus("Connection failed: " + err.message, false);
      }
    }

    function handleStatusUpdate(event) {
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(event.target.value);
      // Format: "STEPS:42,HP:10,HAP:8"
      text.split(',').forEach(item => {
        const [k, v] = item.split(':');
        if (k === "STEPS") document.getElementById("stat-steps").innerText = v;
        if (k === "HP") document.getElementById("stat-health").innerText = `${v}/10`;
        if (k === "HAP") document.getElementById("stat-happy").innerText = `${v}/10`;
      });
    }

    async function sendAction(cmd) {
      if (!actionChar) return;
      try {
        const encoder = new TextEncoder('utf-8');
        await actionChar.writeValue(encoder.encode(cmd));
      } catch (err) {
        console.error("Write error:", err);
      }
    }

    function onDisconnected() {
      updateStatus("Disconnected", false);
      enableButtons(false);
      actionChar = null;
    }

    function updateStatus(text, isConnected) {
      document.getElementById("status-text").innerText = text;
      const dot = document.getElementById("dot");
      if (isConnected) dot.classList.add("connected");
      else dot.classList.remove("connected");
    }

    function enableButtons(enabled) {
      document.querySelectorAll(".btn-grid button:not(.btn-connect)").forEach(b => b.disabled = !enabled);
      document.getElementById("connect-btn").disabled = enabled;
    }
  </script>
</body>
</html>
